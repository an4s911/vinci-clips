# Host Nginx entrypoint for Vinci Clips.
#
# Docker should run only the application services. In production,
# docker-compose.prod.yml publishes the frontend and backend to localhost:
#
#   frontend container -> 127.0.0.1:3000
#   backend container  -> 127.0.0.1:8080
#
# Host Nginx owns public ports 80 and 443, which allows this VPS to host
# multiple sites by adding more server blocks with different server_name values.
#
# Replace example.com with the real domain before enabling this file:
#
#   sudo cp nginx/nginx.conf /etc/nginx/sites-available/vinci-clips
#   sudo sed -i 's/example.com/your-domain.com/g' /etc/nginx/sites-available/vinci-clips
#   sudo ln -sf /etc/nginx/sites-available/vinci-clips /etc/nginx/sites-enabled/vinci-clips
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# After the HTTP site works, let host Certbot add the HTTPS :443 config and
# certificate paths automatically:
#
#   sudo certbot --nginx -d your-domain.com

server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    # Large video uploads go through Nginx before reaching the backend.
    client_max_body_size 2G;

    # Simple public health check for the host reverse proxy.
    location = /health {
        default_type application/json;
        return 200 '{"status":"healthy","service":"nginx"}';
    }

    # API traffic is sent from host Nginx to the backend Docker container.
    # The trailing slash strips /api/ before proxying, matching the old
    # Docker Nginx behavior.
    location /api/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Uploads can take longer than normal API requests.
    location ^~ /api/clips/upload/ {
        proxy_pass http://127.0.0.1:8080/clips/upload/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # Protected media is served by the backend Docker container so auth checks
    # stay in the application.
    location ^~ /api/uploads/ {
        proxy_pass http://127.0.0.1:8080/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:8080/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else goes to the Next.js frontend Docker container.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
