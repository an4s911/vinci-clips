services:
  postgres:
    image: postgres:18
    container_name: vinci-clips-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vinci_clips}
      POSTGRES_USER: ${POSTGRES_USER:-vinci}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpostgrespassword}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - vinci-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vinci} -d ${POSTGRES_DB:-vinci_clips}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vinci-clips-redis
    restart: unless-stopped
    command: |
      sh -c 'redis-server \
        --appendonly yes \
        --requirepass "$${REDIS_PASSWORD}" \
        --maxmemory 512mb \
        --maxmemory-policy noeviction'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-devredispassword}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - vinci-network
    mem_limit: 768m
    cpus: "0.5"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: vinci-clips-backend
    restart: unless-stopped
    environment:
      # Server config
      PORT: 8080
      NODE_ENV: development

      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-vinci}:${POSTGRES_PASSWORD:-devpostgrespassword}@postgres:5432/${POSTGRES_DB:-vinci_clips}?schema=public

      # Session
      SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-change-in-production}

      # Gemini (analyze / clip selection stage only — not used for transcription)
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      LLM_FALLBACK_MODELS: ${LLM_FALLBACK_MODELS:-}

      # whisper.cpp local transcription
      # Place the model at backend/models/ggml-large-v3-turbo.bin for dev (mounted below).
      # Install whisper-cli on your host or inside the container separately.
      WHISPER_BIN: ${WHISPER_BIN:-/usr/local/bin/whisper-cli}
      WHISPER_MODEL: ${WHISPER_MODEL:-/app/models/ggml-large-v3-turbo.bin}
      WHISPER_THREADS: ${WHISPER_THREADS:-}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-}

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-devredispassword}
      CHOKIDAR_USEPOLLING: "true"

      # YouTube / download provider
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      VIDEO_DOWNLOAD_PROVIDER: ${VIDEO_DOWNLOAD_PROVIDER:-ytdlp}
      VIDEO_DOWNLOAD_API_HOST: ${VIDEO_DOWNLOAD_API_HOST:-p.savenow.to}
      VIDEO_DOWNLOAD_API_KEY: ${VIDEO_DOWNLOAD_API_KEY:-}
      VIDEO_DOWNLOAD_FORMAT: ${VIDEO_DOWNLOAD_FORMAT:-1080}
      YTDLP_COOKIES_PATH: ${YTDLP_COOKIES_PATH:-}
      YTDLP_USER_AGENT: ${YTDLP_USER_AGENT:-}

      PIPELINE_NETWORK_CONCURRENCY: ${PIPELINE_NETWORK_CONCURRENCY:-3}
      PIPELINE_TRANSCRIBE_CONCURRENCY: ${PIPELINE_TRANSCRIBE_CONCURRENCY:-2}
      PIPELINE_MEDIA_CONCURRENCY: ${PIPELINE_MEDIA_CONCURRENCY:-2}
      PIPELINE_STAGE_ATTEMPTS: ${PIPELINE_STAGE_ATTEMPTS:-3}
      PIPELINE_BACKOFF_MS: ${PIPELINE_BACKOFF_MS:-5000}
      PIPELINE_PRIORITY_STAGE: ${PIPELINE_PRIORITY_STAGE:-1}
      PIPELINE_PRIORITY_CLIP: ${PIPELINE_PRIORITY_CLIP:-5}
      PIPELINE_PRIORITY_MANUAL_CLIP: ${PIPELINE_PRIORITY_MANUAL_CLIP:-8}
      PIPELINE_PRIORITY_MANUAL_RENDER: ${PIPELINE_PRIORITY_MANUAL_RENDER:-10}
      RECONCILE_INTERVAL_MIN: ${RECONCILE_INTERVAL_MIN:-5}
      RECONCILE_STALE_THRESHOLD_MIN: ${RECONCILE_STALE_THRESHOLD_MIN:-10}
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - ./backend/uploads:/app/uploads
      - ./backend/storage:/app/storage
      - ./backend/temp:/app/temp
      - ./backend/cache:/app/cache
      - ./backend/logs:/app/logs
      - ./backend/models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - vinci-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: vinci-clips-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:8080
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      - backend
    networks:
      - vinci-network

networks:
  vinci-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_node_modules:
    driver: local
  frontend_node_modules:
    driver: local
  frontend_next:
    driver: local
