services:
  postgres:
    image: postgres:18
    container_name: vinci-clips-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vinci_clips}
      POSTGRES_USER: ${POSTGRES_USER:-vinci}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpostgrespassword}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - vinci-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vinci} -d ${POSTGRES_DB:-vinci_clips}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vinci-clips-redis
    restart: unless-stopped
    command: |
      sh -c 'redis-server \
        --appendonly yes \
        --requirepass "$${REDIS_PASSWORD}" \
        --maxmemory 512mb \
        --maxmemory-policy noeviction'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-devredispassword}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - vinci-network
    mem_limit: 768m
    cpus: "0.5"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: vinci-clips-backend
    restart: unless-stopped
    environment:
      # Server config
      PORT: 8080
      NODE_ENV: development

      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-vinci}:${POSTGRES_PASSWORD:-devpostgrespassword}@postgres:5432/${POSTGRES_DB:-vinci_clips}?schema=public

      # Session
      SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-change-in-production}

      # Gemini
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      LLM_FALLBACK_MODELS: ${LLM_FALLBACK_MODELS:-}
      CHUNK_DURATION_SEC: ${CHUNK_DURATION_SEC:-300}
      CHUNK_OVERLAP_SEC: ${CHUNK_OVERLAP_SEC:-30}
      CHUNK_CONCURRENCY: ${CHUNK_CONCURRENCY:-4}

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-devredispassword}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - ./backend/uploads:/app/uploads
      - ./backend/storage:/app/storage
      - ./backend/temp:/app/temp
      - ./backend/cache:/app/cache
      - ./backend/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - vinci-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: vinci-clips-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:8080
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      - backend
    networks:
      - vinci-network

networks:
  vinci-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_node_modules:
    driver: local
  frontend_node_modules:
    driver: local
  frontend_next:
    driver: local
