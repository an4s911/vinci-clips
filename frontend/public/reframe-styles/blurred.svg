<svg viewBox="0 0 90 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="vid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="blur4">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <!-- Background frame -->
  <rect width="90" height="160" rx="4" fill="#0f172a"/>
  <!-- Blurred bg fill (simulated with filtered gradient) -->
  <rect width="90" height="160" rx="4" fill="url(#vid)" opacity="0.35" filter="url(#blur4)"/>
  <!-- Top blurred bar overlay -->
  <rect x="0" y="0" width="90" height="55" fill="#060d1a" opacity="0.55" rx="4"/>
  <!-- Blur band stripes in top bar -->
  <rect x="0" y="6"  width="90" height="4"  fill="#60a5fa" opacity="0.07"/>
  <rect x="0" y="14" width="90" height="6"  fill="#3b82f6" opacity="0.08"/>
  <rect x="0" y="24" width="90" height="4"  fill="#93c5fd" opacity="0.06"/>
  <rect x="0" y="32" width="90" height="7"  fill="#2563eb" opacity="0.09"/>
  <rect x="0" y="44" width="90" height="5"  fill="#60a5fa" opacity="0.07"/>
  <!-- Bottom blurred bar overlay -->
  <rect x="0" y="105" width="90" height="55" fill="#060d1a" opacity="0.55"/>
  <!-- Blur band stripes in bottom bar -->
  <rect x="0" y="108" width="90" height="5"  fill="#3b82f6" opacity="0.08"/>
  <rect x="0" y="118" width="90" height="4"  fill="#60a5fa" opacity="0.07"/>
  <rect x="0" y="126" width="90" height="6"  fill="#2563eb" opacity="0.09"/>
  <rect x="0" y="137" width="90" height="4"  fill="#93c5fd" opacity="0.06"/>
  <rect x="0" y="146" width="90" height="5"  fill="#3b82f6" opacity="0.07"/>
  <!-- Center video area: clear 16:9 (height = 90*9/16 ≈ 50, y = (160-50)/2 = 55) -->
  <rect x="0" y="55" width="90" height="50" fill="url(#vid)"/>
  <!-- Separator lines -->
  <line x1="0" y1="55"  x2="90" y2="55"  stroke="white" stroke-width="0.75" opacity="0.6"/>
  <line x1="0" y1="105" x2="90" y2="105" stroke="white" stroke-width="0.75" opacity="0.6"/>
  <!-- Person silhouette in center video area -->
  <ellipse cx="45" cy="73" rx="8" ry="9"  fill="white" opacity="0.3"/>
  <rect x="36" y="82" width="18" height="16" rx="3" fill="white" opacity="0.25"/>
</svg>
