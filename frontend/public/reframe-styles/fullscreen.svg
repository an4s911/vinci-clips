<svg viewBox="0 0 90 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#1d4ed8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1e40af" stop-opacity="0.75"/>
    </linearGradient>
  </defs>
  <!-- Full 9:16 frame filled with video -->
  <rect width="90" height="160" rx="4" fill="#0f172a"/>
  <rect width="90" height="160" rx="4" fill="url(#fg)"/>
  <!-- Person silhouette centered -->
  <ellipse cx="45" cy="68" rx="12" ry="13" fill="white" opacity="0.25"/>
  <rect x="31" y="81" width="28" height="28" rx="5" fill="white" opacity="0.2"/>
  <!-- Dashed crop guides showing where 16:9 source was trimmed (at ~20% and ~80% vertical) -->
  <line x1="0" y1="32" x2="90" y2="32" stroke="white" stroke-width="1" stroke-dasharray="5,3" opacity="0.55"/>
  <line x1="0" y1="128" x2="90" y2="128" stroke="white" stroke-width="1" stroke-dasharray="5,3" opacity="0.55"/>
  <!-- Scissor marks at crop lines -->
  <circle cx="6" cy="32" r="3" fill="white" opacity="0.5"/>
  <circle cx="84" cy="128" r="3" fill="white" opacity="0.5"/>
  <!-- Corner brackets -->
  <path d="M4,4 L4,12 M4,4 L12,4" stroke="white" stroke-width="1.5" fill="none" opacity="0.7"/>
  <path d="M86,4 L86,12 M86,4 L78,4" stroke="white" stroke-width="1.5" fill="none" opacity="0.7"/>
  <path d="M4,156 L4,148 M4,156 L12,156" stroke="white" stroke-width="1.5" fill="none" opacity="0.7"/>
  <path d="M86,156 L86,148 M86,156 L78,156" stroke="white" stroke-width="1.5" fill="none" opacity="0.7"/>
</svg>
