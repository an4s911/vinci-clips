services:
  postgres:
    image: postgres:18
    container_name: vinci-clips-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vinci_clips}
      POSTGRES_USER: ${POSTGRES_USER:-vinci}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - vinci-network
    mem_limit: 2g
    cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vinci} -d ${POSTGRES_DB:-vinci_clips}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: vinci-clips-redis-prod
    restart: always
    command: |
      sh -c 'redis-server \
        --appendonly yes \
        --requirepass "$${REDIS_PASSWORD}" \
        --maxmemory 512mb \
        --maxmemory-policy noeviction'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - vinci-network
    mem_limit: 768m
    cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vinci-clips-backend-prod
    restart: always
    environment:
      PORT: 8080
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-vinci}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vinci_clips}?schema=public
      SESSION_SECRET: ${SESSION_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      LLM_FALLBACK_MODELS: ${LLM_FALLBACK_MODELS:-}
      CHUNK_DURATION_SEC: ${CHUNK_DURATION_SEC:-300}
      CHUNK_OVERLAP_SEC: ${CHUNK_OVERLAP_SEC:-30}
      CHUNK_CONCURRENCY: ${CHUNK_CONCURRENCY:-4}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://localhost}
      MEDIA_CLEANUP_ENABLED: ${MEDIA_CLEANUP_ENABLED:-true}
      MEDIA_CLEANUP_INTERVAL_HOURS: ${MEDIA_CLEANUP_INTERVAL_HOURS:-6}
      MEDIA_TEMP_RETENTION_HOURS: ${MEDIA_TEMP_RETENTION_HOURS:-24}
      MEDIA_UNREFERENCED_RETENTION_HOURS: ${MEDIA_UNREFERENCED_RETENTION_HOURS:-1}
      MEDIA_ADMIN_TOKEN: ${MEDIA_ADMIN_TOKEN:-}
      YTDLP_COOKIES_PATH: ${YTDLP_COOKIES_PATH:-}
      YTDLP_USER_AGENT: ${YTDLP_USER_AGENT:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      VIDEO_DOWNLOAD_PROVIDER: ${VIDEO_DOWNLOAD_PROVIDER:-ytdlp}
      VIDEO_DOWNLOAD_API_HOST: ${VIDEO_DOWNLOAD_API_HOST:-p.savenow.to}
      VIDEO_DOWNLOAD_API_KEY: ${VIDEO_DOWNLOAD_API_KEY:-}
      VIDEO_DOWNLOAD_FORMAT: ${VIDEO_DOWNLOAD_FORMAT:-1080}
    expose:
      - "8080"
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8080}:8080"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/storage:/app/storage
      - ./backend/temp:/app/temp
      - ./backend/cache:/app/cache
      - ./backend/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vinci-network
    mem_limit: 10g
    mem_reservation: 2g
    cpus: "3.0"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    container_name: vinci-clips-frontend-prod
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    expose:
      - "3000"
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_started
    networks:
      - vinci-network
    mem_limit: 2g
    mem_reservation: 512m
    cpus: "1.0"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  vinci-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
